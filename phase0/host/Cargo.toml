[package]
name = "host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["cranelift"]
cranelift = ["wasmtime/cranelift"]
pulley = ["wasmtime/pulley"]

[dependencies]
wasmtime = { version = "49.0.0", default-features = false, features = [
    "component-model",
    "async",
    "std",
    "runtime",
    "parallel-compilation",
] }
wasmtime-wasi = { version = "49.0.0", default-features = false, features = ["p2"] }
