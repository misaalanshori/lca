# A test that blocks forever must not take the pipeline down with it.
# The hosted Linux and Windows runners spent a whole day wedged at the
# nextest step with no logs stored (a job that never ends never stores
# them), so every test gets a hard ceiling: slow after60s, killed
# after two periods plus grace. Locally the slowest tests (trap
# isolation, hooks) finish in about thirty seconds, so this fires only
# for a real hang - and when it does, it fails with the test's name
# instead of an anonymous job that lives for six hours.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

# gh #429: `e2e_install`'s Phase 5 exit test is the one row whose cost is
# dominated by test-profile wasmtime compilation, and it needs its own
# ceiling.
#
# Measured 2026-10-21 on this worktree, stage breakdown of
# a_clean_machine_installs_from_oci_and_https_then_runs_a_turn:
#
#     fixtures (mock registry, skills zip, archive server, model)   0.02 s
#     sandbox                                                       0.00 s
#     OCI install + consent                                         0.08 s
#     HTTPS archive install + consent                               0.02 s
#     ext list / config / info blocks                              0.16 s
#     turn one, denied (loads the installed WASM provider)         12.1 s
#     turn two, granted (loads it again)                          14.3 s
#     ext update / remove / decline path                           0.18 s
#
# So 94% of the row is two turns, and each turn is a process that loads an
# installed component. `wasmtime::component::Component::new` on the
# 558 KB openai-compatible fixture costs:
#
#     test profile (debug_assertions = true)   21.8 s
#     release profile                           1.7 s
#
# a ~12x compilation penalty, paid again by every turn-shaped spawn in every
# e2e row. That is why sharing the fixture setup (the issue's option 3)
# cannot help - the shared part is 0.12 s of 42 s - and why splitting the
# row (option 2) would split a 12 s fixed cost per process across rows
# without reducing the total. The honest cost is per-spawn compilation in a
# test build, which is a product characteristic, not slack in this row.
#
# Budget arithmetic. Loaded wall-clock for this row, run concurrently with a
# second full suite (`-p lca-core`), six samples including the issue's own
# measurement: 50.3, 63.8, 66, 71, 78.5, 85.9, 103.6 s. p95 = 85.9 s,
# worst = 103.6 s. Taking worst x 2 = 207.2 s rounds to 210 s: a 2.0x margin
# over the worst observed run, so a slower runner or a third concurrent
# suite has real room, while a genuine regression still trips it long before
# the pipeline's patience runs out.
#
# Scope. The filter names the test, not the binary: the other four rows in
# `e2e_install` (`ext_list_names_builtins_explicitly` and neighbours) keep
# the 60s/2 budget above, and a new row added to this binary inherits it too
# rather than silently getting 210 s.
[[profile.default.overrides]]
filter = 'test(=a_clean_machine_installs_from_oci_and_https_then_runs_a_turn)'
slow-timeout = { period = "210s", terminate-after = 1 }

# gh #608: `tree_navigator`'s budgets are adaptive, bounded by the row's own
# 300 s deadline (`Pace::ROW_DEADLINE`), so the ceiling here must sit just above
# that or nextest would kill the test before the row can report which pane never
# showed what. The measurement behind it: on a 4-core box shared with a build,
# one `done` step needed more than 100 s (exactly `25 s x 4`, the harness cap) -
# so the row's old ceiling was the binding constraint, not the box's signal.
[[profile.default.overrides]]
filter = 'test(=tree_navigator_folds_filters_and_selects_in_a_real_terminal)'
slow-timeout = { period = "330s", terminate-after = 1 }

# gh #611: **every row in `lca-ext-host` that loads an extension compiles it.** A
# `wasmtime::component::Component::new` on one of the fixture components costs 13-30 s
# in a test build (against 1.7 s in release), and it is >96% of the row's wall clock -
# `instantiate_pre` plus the per-world `*Pre::new` work measures 3-6 ms beside it.
# Measured on this 4-core box (2026-11-23):
#
#   * sequential, loadavg ~10: 13.3, 13.5, 15.1, 15.9, 16.9, 17.1, 17.3, 20.1, 20.4,
#     24.8, 30.0 s for the twelve compile-bearing rows (mean ~18 s);
#   * under twelve hogs plus the suite's own parallelism: **one compile took 62.8 s**,
#     and the rows that compile **twice** (`host::a_trapping_call_...`,
#     `bundled_wasm::the_committed_component_and_a_fresh_build_...`) crossed 120 s and
#     were killed at the default ceiling - three times in the #609 cycle's gate runs.
#
# Why not share the compile instead (gh #611's candidate A, measured and rejected): a
# compiled `Component` belongs to its `Engine`, so sharing one means sharing the engine
# - and wasmtime's epoch interruption is **engine-global**. `WasmExtension::interrupt`
# bumps `engine.increment_epoch()` (`dispatch_hooks.rs`), so two extensions on one
# engine would trap each other, which is exactly what `stateful`'s
# `an_epoch_bump_for_one_guest_leaves_an_idle_guest_usable`,
# `one_guests_trap_never_touches_another_guest` and `a_sibling_cancel_never_traps_a_running_guest`
# forbid. The supported alternative, wasmtime's compilation cache (`wasmtime/cache`),
# pulls `wasmtime-cache` -> `zstd-sys`, a C build dependency this tree deliberately does
# not carry (the SRDD's flate2 row pins the rust backend for the same reason).
#
# The ceiling, then. `terminate-after = 1` rather than 2: the rows' normal cost is 13-30 s
# and their worst measured cost under load is ~125 s (two compiles at ~62 s), so 240 s is
# nearly 2x the worst case, while a genuine hang - a deadlock, an endless guest loop, a
# test waiting on a channel nothing sends - never ends on its own and is still killed at
# 240 s. Doubling the period with `terminate-after = 2` would keep such a hang for eight
# minutes to protect rows that need two. The filter is the crate's whole binary set
# rather than four row names: `ExtHost::load` is what costs this, and a new compile-bearing
# row should inherit the ceiling rather than be re-discovered by a red run.
[[profile.default.overrides]]
filter = 'binary_id(/^lca-ext-host/)'
slow-timeout = { period = "240s", terminate-after = 1 }
