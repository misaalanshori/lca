[package]
name = "question"
description = "Model-facing interactive question tool via host dialogs (gh #221)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
lca-permissions = { path = "../../crates/lca-permissions" }
lca-protocol = { path = "../../crates/lca-protocol" }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lca-ext-abi = { path = "../../crates/lca-ext-abi" }
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
