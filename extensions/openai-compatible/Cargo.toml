[package]
name = "openai-compatible"
description = "Default provider: any OpenAI-compatible chat completions endpoint (native-linked by default, ADR-0013)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# rlib for the native handle, cdylib for the wasm32-wasip2 component.
crate-type = ["rlib", "cdylib"]

[dependencies]
lca-protocol = { path = "../../crates/lca-protocol" }
serde_json.workspace = true
# Parsing the extension's own `resources/provider-presets.toml` (ADR-0031).
toml.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The dispatch contract (native handle) and the shared capability engine
# this provider's transport runs on - never a socket of its own. All
# native-only: the guest speaks host imports instead (lca-tools drags
# the full tokio feature set, which does not build on wasm).
lca-ext-abi = { path = "../../crates/lca-ext-abi" }
lca-tools = { path = "../../crates/lca-tools" }
lca-permissions = { path = "../../crates/lca-permissions" }
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[dev-dependencies]
lca-testkit = { path = "../../crates/lca-testkit" }
toml.workspace = true

[lints]
workspace = true
