# Per-model image behavior (#39): vision flags from the same
# models.dev catalog gh #34's context windows come from.
#
# Ground rule (shared with context-windows.toml): every entry
# carries the source it was copied from, on its own line, and
# nothing here is estimated. A model absent from this file has
# unknown vision: images pass through at original size, exactly
# as before. `vision = true` with no resize profile keeps pi's
# conservative defaults (2000x2000, 4.5 MiB, JPEG 80); a
# resize profile lands here only with vendor numbers behind it,
# which no vendor publishes today.
#
# Sources: `models.dev/<provider> <date>` - the `modalities.input`
# array of each model entry (fetched 2026-10-05). `vision = true`
# means `image` is in that array; `false` means input is
# text-only there. The table is read by `parse_image_limits`;
# unknown keys inside an entry are ignored, so resize fields
# (`max_width`, `max_height`, `max_bytes`) can join later
# without disturbing vision reads.

["deepseek-v4-flash"]
vision = false   # models.dev/`opencode-go` 2026-10-05 (modalities.input = ["text"])

["deepseek-v4-flash-vision-exp"]
vision = true   # models.dev/`opencode-go` 2026-10-05 (modalities.input = ["text", "image"])

