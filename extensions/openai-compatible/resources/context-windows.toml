# Per-model context windows (GitHub issue #34): the number the footer's
# `ctx` percentage and the compaction threshold (FR-SESS-4) divide by.
#
# Ground rule: every number carries the source it was copied from, on its
# own line, and nothing here is estimated. A model absent from this file
# reports no window and keeps `ctx ?` - an honest unknown beats a wrong
# denominator, which silently mis-triggers compaction.
#
# Sources, in the order the cycle brief gives them:
#   `models.dev/<provider> <date>` - the models.dev catalog
#   (https://models.dev/api.json), which is the table pi's own catalog is
#   generated from (`~/gits/pi`, packages/ai/scripts/generate-models.ts).
#   pi's footer rendering `1.0M` for mimo-v2.6-flash matches this table's
#   1048576 exactly.
#   The live endpoint is source 1 and reports nothing usable here:
#   `GET https://opencode.ai/zen/go/v1/models` returns only
#   id/object/created/owned_by - no limit field of any name. Verified
#   2026-10-03 with the sanctioned testing key (file reference only).
#   OpenRouter is the one endpoint that does report one -
#   `context_length` - and it cross-checks: openai/gpt-4o reads 128000
#   live and in the catalog below.
#
# Kept in its own resource rather than in provider-presets.toml because
# `shipped_presets_contain_no_development_policy_ids` scans that file for
# development-harness ids, and several of these are now live product
# models on opencode-go (they are in the endpoint's own `GET /models`).


