# Local endpoints: no key step, model discovery over `GET /models` or the
# curated list. The "provider you can try in thirty seconds" path (D3).

[[preset]]
id = "ollama"
name = "Ollama (local)"
base_url = "http://localhost:11434/v1"
env = []
auth = "none"
models = ["qwen2.5-coder:7b", "llama3.2"]

[[preset]]
id = "lmstudio"
name = "LM Studio (local)"
base_url = "http://localhost:1234/v1"
env = []
auth = "none"
models = ["local-model"]
