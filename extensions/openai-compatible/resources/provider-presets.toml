# Provider presets (ADR-0031): the extension's own data, loaded through
# `lca:host/resources`. The host never parses this; the extension answers
# the host's picker query from it. Shape stolen from pi's provider
# registry; `auth = "none"` is a local endpoint with no key step.

[[preset]]
id = "openai"
name = "OpenAI"
base_url = "https://api.openai.com/v1"
env = ["OPENAI_API_KEY"]
auth = "bearer"
models = ["gpt-4o", "gpt-4o-mini", "o3-mini"]

[[preset]]
id = "openrouter"
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env = ["OPENROUTER_API_KEY"]
auth = "bearer"
models = ["openai/gpt-4o", "anthropic/claude-3.5-sonnet", "google/gemini-2.0-flash"]

