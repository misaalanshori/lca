name = "openai-compatible"
version = "1.0.0"
abi = "0.6"
worlds = ["provider"]
description = "Any OpenAI-compatible chat completions endpoint. Configurable base URL and key."
resources = ["provider-presets.toml", "context-windows.toml", "image-limits.toml"]

[capabilities.net]
hosts = ["api.openai.com"]

# Gh #294: the `ollama` and `lmstudio` presets point at
# `http://localhost:<port>/v1`, so model discovery there is refused by the
# `net` rules above (which reach only `api.openai.com`, and never a loopback
# address at all - FR-PERM-13's rebinding rule). The minimum that makes those
# two presets work: the literal loopback names they actually use. No CIDR
# block and no `*.local`, because a preset for "a server on this machine"
# never needs a LAN device, and a broad grant to fix a loopback problem is
# the failure mode the capability model exists to prevent (ADR-0011).
[capabilities.net-local]
addresses = ["localhost", "127.0.0.1"]

[capabilities.credentials]
namespace = "openai-compatible"

# Gh #157: the environment override the host consults before stored
# credentials when computing the ad hoc `net` grant.
[login]
env_base_url = "OPENAI_BASE_URL"

# Gh #461 / gh #170: the environment this provider reads.
#
# A WASM component is instantiated with an empty `WasiCtx`, so
# `std::env::var` inside it answers `NotPresent` unless the manifest
# declares the name and the host forwards it. This provider reads the
# environment in three places - `Settings::default` (endpoint, key, model,
# context window, and two behaviour switches), `profiles::base_url_for`
# (the endpoint), and `profiles::env_var` (a key) - so without this block
# the sandboxed build behaved as if nothing were configured, which is
# exactly why `lca-cli` once carried the `openai_ad_hoc_host()` workaround
# (gh #157).
#
# The list is the **minimum set**: the names this crate reads by literal,
# each justified. The per-preset key names (`GROQ_API_KEY`,
# `OPENROUTER_API_KEY`, …) are deliberately **absent** - they come from the
# `provider-presets.toml` resource at run time, so no manifest can enumerate
# them without either a broad grant or a list that goes stale when a preset
# is added. `docs/providers/openai-compatible.md` records that consequence:
# a named profile's key resolves from its stored credential under the
# sandbox, and from the environment only in the native build.
#
#   OPENAI_BASE_URL           the endpoint (default https://api.openai.com/v1)
#   OPENAI_API_KEY            the default profile's key, before OPENCODE_API_KEY
#   OPENCODE_API_KEY          the OpenCode Go key, this provider's second name
#   OPENAI_MODEL              the model, when not chosen per-request
#   LCA_MODEL                 the model override shared with other providers
#   OPENAI_CONTEXT_WINDOW     the context window, when the catalog cannot say
#   OPENAI_PROMPT_CACHE_KEY   "0"/"false"/"off" disables the cache pin (ADR-0031)
#   OPENAI_SUPPORTS_REASONING "0"/"false"/"off" disables `reasoning_effort`
[capabilities.env]
keys = [
    "OPENAI_BASE_URL",
    "OPENAI_API_KEY",
    "OPENCODE_API_KEY",
    "OPENAI_MODEL",
    "LCA_MODEL",
    "OPENAI_CONTEXT_WINDOW",
    "OPENAI_PROMPT_CACHE_KEY",
    "OPENAI_SUPPORTS_REASONING",
]
