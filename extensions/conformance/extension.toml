name = "conformance"
version = "0.1.0"
abi = "0.6"
worlds = ["tool", "tool-catalog", "command", "hooks", "hooks-message", "hooks-tool-call", "hooks-tool-result", "hooks-stream", "hooks-settle", "hooks-compaction", "hooks-cache", "hooks-trust", "provider", "compaction", "context-transform", "ui", "serve-http"]
description = "ABI conformance probe covering every world, import, and denied path."
license = "Apache-2.0"

[capabilities.fs]
workspace = "read-write"

[capabilities.process]
reason = "Runs probe programs for conformance."

[capabilities.pty]
reason = "Runs interactive probe programs for conformance."

# The manifest schema requires `net` when `oauth` is declared (the token
# exchange uses it). The probe never calls net; the grant exists only so the
# oauth flow can be exercised at the WASM boundary.
[capabilities.net]
hosts = ["conformance.example.com"]

[capabilities.oauth]
redirect_path = "/callback"
timeout_seconds = 30

# Gh #170: the `env` grant. Two names so the probe can compare all three
# answers: granted-and-set (`LCA_CONFORMANCE_ENV`), declared-but-unset
# (`LCA_CONFORMANCE_UNSET`, which must read absent rather than empty), and
# undeclared (`LCA_CONFORMANCE_UNDECLARED`, which the host may have set and the
# component must still not see).
[capabilities.env]
keys = ["LCA_CONFORMANCE_ENV", "LCA_CONFORMANCE_UNSET"]
reason = "Reads the probe variables that demonstrate the environment grant."

[capabilities.credentials]
namespace = "conformance"

[capabilities.ui]
regions = ["status-line", "footer", "panel", "modal"]

[capabilities.tools]
reason = "Calls its own suite tools through the host for nested-call conformance."

# Gh #363 / ADR-0049: the inbound HTTP capability. The listener is the host's
# (loopback only, token-authenticated, path-routed); this grant is what makes
# the host mount the probe's namespace on it.
[capabilities.serve-http]
reason = "Answers probe requests so the inbound HTTP path is exercised in both delivery modes."
