[package]
name = "conformance"
description = "The ABI conformance extension: exercises every world, every host import, and every denied path in both delivery modes (NFR-25)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# rlib for the native twin, cdylib for the wasm32-wasip2 component.
crate-type = ["rlib", "cdylib"]

[dependencies]
lca-protocol = { path = "../../crates/lca-protocol" }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lca-ext-abi = { path = "../../crates/lca-ext-abi" }
# Native twin only: the shared capability engine (never linked into wasm).
lca-tools = { path = "../../crates/lca-tools" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[lints]
workspace = true
