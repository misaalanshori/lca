[package]
name = "compaction-default"
description = "The default compaction strategy: summarizes the candidate range through the completion capability, with a mechanical fallback. Native-linked by default (ADR-0013)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
lca-protocol = { path = "../../crates/lca-protocol" }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lca-ext-abi = { path = "../../crates/lca-ext-abi" }
lca-tools = { path = "../../crates/lca-tools" }
lca-permissions = { path = "../../crates/lca-permissions" }
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
