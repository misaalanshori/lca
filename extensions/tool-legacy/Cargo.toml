[package]
name = "tool-legacy"
description = "The pre-catalog single-tool shape (gh #77 compat): one `get-schema` plus `run`, no `tool-catalog` world. Proves a guest that never heard of suites keeps loading and dispatching."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# rlib for direct tests, cdylib for the wasm32-wasip2 fixture.
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[lints]
workspace = true
