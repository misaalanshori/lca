name = "openrouter"
version = "0.1.0"
abi = "0.6"
worlds = ["provider"]
description = "OpenRouter multi-model provider with one-click browser OAuth sign-in."

[capabilities.net]
hosts = ["openrouter.ai"]

[capabilities.oauth]
redirect_path = "/callback"

[capabilities.credentials]
namespace = "openrouter"

# Gh #297: this provider signs in through its own `provider-identity`
# login (an OAuth or device-code flow it runs itself) and declares no
# `login-options` presets. The declaration is what puts it in the /login
# picker: the host must not run the flow to discover that the flow exists.
[login]
identity = true
