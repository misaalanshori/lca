# The authoritative first-party extension catalog (#227): what the
# `/extensions` hub lists under Official provenance, and what
# `lca ext search` queries. Versions track the manifests; refs name
# the `abi-0.6` line tags (the host filters by its own ABI window at
# read time, so a stale entry never offers).

[version]
format = 1

[[extension]]
name = "openai-compatible"
version = "1.0.0"
abi = "0.6"
category = "provider"
description = "Any OpenAI-compatible chat completions endpoint. Configurable base URL and key."
oci_ref = "ghcr.io/misaalanshori/lca/openai-compatible:abi-0.6"
capabilities = ["net", "credentials"]

[[extension]]
name = "anthropic"
version = "0.1.0"
abi = "0.6"
category = "provider"
description = "Anthropic Claude models via API key or Claude Pro/Max subscription."
oci_ref = "ghcr.io/misaalanshori/lca/anthropic:abi-0.6"
capabilities = ["net", "oauth", "credentials"]

