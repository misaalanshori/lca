# `mcp` is deliberately absent: it is a first-class internal subsystem
# (`crates/lca-mcp`), not an installable extension (gh #418, ADR-0047).

[[extension]]
name = "skills"
version = "1.0.0"
abi = "0.6"
category = "context-transform"
description = "Match a project skill against the latest user message and inject its instructions before the model sees the turn."
oci_ref = "ghcr.io/misaalanshori/lca/skills:abi-0.6"
capabilities = ["fs"]
