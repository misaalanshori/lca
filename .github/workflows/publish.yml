name: publish

# Phase 5's publication half: every tagged release publishes the
# first-party components as OCI artifacts on ghcr.io (repo-scoped, so a
# public repo means an anonymously pullable registry - the1.0 design
# supports anonymous public pulls only) and attaches the HTTPS-archive
# asset the plain-HTTPS source kind installs from (ADR-0010).
#
# The runner's GITHUB_TOKEN carries packages: write, which a personal
# access token in this account does not - that is why publication lives
# here instead of in scripts/publish-oci.sh run by hand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: The release tag to attach assets to
        required: true

env:
  CARGO_TERM_COLOR: always

# A release is deliberate: queue a second publish rather than cancel one
# mid-upload and leave partial assets on the tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the regression-backfill check needs the
          # previous release tag to diff tests/regressions/.
          fetch-depth: 0
      - name: Check the regression backfill
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "no previous tag; first release, nothing to check"
            exit 0
          fi
          fixed=$(git diff "$prev..$RELEASE_TAG" -- CHANGELOG.md | grep -c '^+.*### Fixed' || true)
          if [ "$fixed" -eq 0 ]; then
            echo "no '### Fixed' changelog section in this release"
            exit 0
          fi
          changed=$(git diff --name-only "$prev..$RELEASE_TAG" -- tests/regressions/)
          if [ -z "$changed" ]; then
            echo "::error::the release changelog has a '### Fixed' section but tests/regressions/ gained no file since $prev (docs/testing-plan.md section 7, NFR-24)"
            exit 1
          fi
          echo "regression backfill present:"
          echo "$changed"
      - name: Install the pinned toolchain
        run: |
          rustup set profile minimal
          rustup target add wasm32-wasip2
      - name: Build the first-party components
        run: |
          cargo build --release --target wasm32-wasip2 \
            -p openai-compatible -p skills -p compaction-default -p antigravity
      - name: Refresh the committed fixtures
        run: |
          cp target/wasm32-wasip2/release/openai_compatible.wasm extensions/openai-compatible/fixtures/component.wasm
          cp target/wasm32-wasip2/release/antigravity.wasm extensions/antigravity/fixtures/component.wasm
          cp target/wasm32-wasip2/release/skills.wasm extensions/skills/fixtures/component.wasm
      - name: Pack the HTTPS-archive asset (ADR-0010's zip)
        run: |
          abi=$(python3 -c "import sys;v=dict(l.split(' = ') for l in open(sys.argv[1]) if ' = ' in l)['abi'];print(v.strip().strip('\"'))" extensions/skills/extension.toml)
          echo "SKILLS_ABI=$abi" >> "$GITHUB_ENV"
          python3 - "$abi" <<'PY'
          import sys, zipfile
          abi = sys.argv[1]
          with zipfile.ZipFile(f"skills-abi-{abi}.zip", "w") as z:
              z.write("extensions/skills/extension.toml", "extension.toml")
              z.write("extensions/skills/fixtures/component.wasm", "component.wasm")
          PY
      - name: Upload the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          gh release upload "${RELEASE_TAG}" "skills-abi-${SKILLS_ABI}.zip" --clobber
      - name: Publish the OCI artifacts (abi line tag + version tag)
        env:
          GH_TOKEN: ${{ github.token }}
          LCA_OCI_USER: ${{ github.actor }}
        run: |
          publish() {
            local image="$1" wasm="$2" manifest="$3" version abi
            # strip() before strip('"'): the line carries its newline, so
            # a bare strip('"') leaves it inside the tag and the registry
            # looks for a tag that is not there (404).
            version=$(python3 -c "import sys;v=dict(l.split(' = ') for l in open(sys.argv[1]) if ' = ' in l)['version'];print(v.strip().strip('\"'))" "$manifest")
            abi=$(python3 -c "import sys;v=dict(l.split(' = ') for l in open(sys.argv[1]) if ' = ' in l)['abi'];print(v.strip().strip('\"'))" "$manifest")
            bash scripts/publish-oci.sh "misaalanshori/lca/${image}" "abi-${abi}" "$wasm" "$manifest"
            bash scripts/publish-oci.sh "misaalanshori/lca/${image}" "${version}" "$wasm" "$manifest"
          }
          publish openai-compatible extensions/openai-compatible/fixtures/component.wasm extensions/openai-compatible/extension.toml
          publish skills extensions/skills/fixtures/component.wasm extensions/skills/extension.toml
          publish compaction-default target/wasm32-wasip2/release/compaction_default.wasm extensions/compaction-default/extension.toml
          publish antigravity target/wasm32-wasip2/release/antigravity.wasm extensions/antigravity/extension.toml
      # Best effort: repo-scoped packages follow the public repo's
      # visibility, this just makes it explicit when the API allows.
      - name: Ensure the packages are public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for image in openai-compatible skills compaction-default antigravity; do
            gh api --method PATCH "/user/packages/container/lca%2F${image}" -f visibility=public || true
          done

  # The release build: reproducible, checksummed, provenance-attested
  # artifacts for every target the release policy names. The macOS
  # pairs build on macOS runners natively - apple targets need the
  # platform's own SDK (docs/platform-notes.md), and cross-linking
  # them from Linux with zig never found one (the Phase 0 matrix's
  # receipt shows the same wall).
  artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          - os: ubuntu-latest
            name: windows
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          # The arm mac builds both darwin targets: Apple's SDK is
          # universal, so rustup target add + a normal build cross the
          # one remaining arch on the same runner. The Intel label sat
          # queued for hours with no runner picking it up; this keeps
          # NFR-9 (built natively on macOS) without betting the
          # release queue on Intel hardware supply.
          - os: macos-14
            name: darwin-x86_64
            targets: x86_64-apple-darwin
          - os: macos-14
            name: darwin-aarch64
            targets: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup set profile minimal
          for target in ${{ matrix.targets }}; do rustup target add "$target"; done
      - name: LLVM19 for the MSVC build scripts
        if: runner.os == 'Linux'
        # apt.llvm.org's19 is19.1.7 - the exact version both windows
        # exes built with locally. Ubuntu's archive ships19.1.1, whose
        # clang-cl disagrees with xwin's intrin.h over __prefetch
        # (wasmtime-fiber's windows.c fails to compile there and only
        # there).
        run: |
          curl -sSfL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19
          sudo apt-get install -y -q clang-19
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          # Pinned to the local receipt's versions: xwin's SDK snapshot
          # moves with its release, and the newest MSVC intrin.h
          # disagrees with clang-19 over __prefetch (wasmtime-fiber's
          # windows.c) - 0.23.1's snapshot compiles it.
          tool: cargo-zigbuild@0.23.4,cargo-xwin@0.23.1
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: "0.16.0"

      # Verifies: NFR-17's reproducible double build (a tagged commit
      # reproduces byte for byte, or the published checksums are a
      # lie) - on the linux leg, where the musl target builds twice
      # without a cache between them.
      - name: Reproducible double build (linux x86_64 musl)
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          common="--remap-path-prefix=$PWD=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          CARGO_TARGET_DIR=target/repro-a \
            RUSTFLAGS="$common --remap-path-prefix=$PWD/target/repro-a=/out" \
            cargo zigbuild --release --target x86_64-unknown-linux-musl -p lca-cli
          CARGO_TARGET_DIR=target/repro-b \
            RUSTFLAGS="$common --remap-path-prefix=$PWD/target/repro-b=/out" \
            cargo zigbuild --release --target x86_64-unknown-linux-musl -p lca-cli
          a=target/repro-a/x86_64-unknown-linux-musl/release/lca
          b=target/repro-b/x86_64-unknown-linux-musl/release/lca
          sha_a=$(sha256sum "$a" | cut -d" " -f1)
          sha_b=$(sha256sum "$b" | cut -d" " -f1)
          echo "$sha_a vs $sha_b"
          test "$sha_a" = "$sha_b"

      # Verifies: NFR-8 (the two linux musl targets), NFR-9 (the two
      # macOS targets, built natively on macOS), NFR-10 (the two
      # Windows MSVC targets): all six artifacts come out of this
      # matrix (docs/platform-notes.md names each pair).
      - name: Build the assigned targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.name }}" == "windows" ]]; then
            # ring's aarch64-Windows path forces plain gcc-mode clang
            # (its own FIXME) while cargo-xwin supplies MSVC-style flags;
            # the committed shim translates between them.
            # Shim DIR first: /usr/lib/llvm-19/bin also ships a `clang`,
            # and PATH order decides which one cc-rs finds.
            sudo mkdir -p /opt/cc-shim
            sudo install -m755 ci/clang-shim /opt/cc-shim/clang
            export PATH="/opt/cc-shim:/usr/lib/llvm-19/bin:$PATH"
            export CC_x86_64_pc_windows_msvc=clang
            export CC_aarch64_pc_windows_msvc=clang
          fi
          for target in ${{ matrix.targets }}; do
            if [[ "$target" == *musl ]]; then
              cargo zigbuild --release --target "$target" -p lca-cli
              cp "target/$target/release/lca" "dist/lca-$target"
            elif [[ "$target" == *windows-msvc ]]; then
              cargo xwin build --release --target "$target" -p lca-cli
              cp "target/$target/release/lca.exe" "dist/lca-$target.exe"
            else
              cargo build --release --target "$target" -p lca-cli
              cp "target/$target/release/lca" "dist/lca-$target"
            fi
          done
          # Cycle-3 §8: assert the binary exists before packaging. A bare
          # `cargo build --release` once built the root regression package
          # and produced no `lca`, and the failure surfaced only at `cp`.
          for artifact in dist/lca-*; do
            test -s "$artifact" || { echo "missing or empty binary: $artifact"; exit 1; }
          done
          ls -l dist

      - name: Upload this leg's artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist && sha256sum * > artifacts.sha256 && cat artifacts.sha256
      - name: Sign the artifacts (provenance attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
