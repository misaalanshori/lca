name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A superseded push should not leave a doomed run to finish slowly (the
# cancelled-run noise the owner noticed): cancel the older run for the
# same branch. Reviews and pushes to other refs are unaffected.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three topologies, chosen by what each platform actually needs:
#
#   * test-split     - the suite SPLIT into four bounded jobs by package
#                       group, on Linux AND macOS. A monolithic Linux nextest
#                       step aged past forty-five minutes and lost its runner
#                       agent ("lost communication with the server")
#                       repeatedly; macOS runs the same groups so the heavy
#                       WASM and loopback packages do not compete with the
#                       whole suite for a three-core runner (an intermittent
#                       `antigravity` loopback timeout motivated it). No job
#                       here may outlive thirty minutes, and every one keeps
#                       its own log as an artifact whether it passed or not.
#   * test           - Windows, the whole suite in one job (the split bought
#                       nothing there and the platform needs the full matrix
#                       signal).
#   * ubuntu-gates    - the five timing tests (NFR-4, NFR-5, NFR-29),
#                       serial on a release build with the machine to
#                       itself - where their thresholds were measured
#                       - plus cargo-deny and the traceability gate.
#
# The timing tests are excluded from every ordinary suite invocation
# by the same predicate that selects them here: never skipped,
# measured alone.
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup set profile minimal
          rustup component add clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: docs (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      # Verifies: NFR-12 (the suite runs on Linux, macOS, and Windows).
      - name: tests (nextest)
        # bash, not the runner's default shell: `set -o pipefail` and
        # `tee` do not exist in PowerShell, and a shell-level error
        # would fail this step before a single test ran.
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --no-fail-fast \
            -E 'not test(/nfr|instantiation|hook|epoch/)' \
            2>&1 | tee nextest-output.log
          status=${PIPESTATUS[0]}
          exit $status
      # Verifies: NFR-5's real bound: hook overhead measured against a
      # release wasmtime (debug instrumentation dominates the1 ms).
      - name: nfr release gates
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --release -p lca-ext-host --test-threads=1 \
            -E 'test(/nfr|instantiation|hook|epoch/)' \
            2>&1 | tee nfr-gates-output.log
          status=${PIPESTATUS[0]}
          exit $status
      # Verifies: NFR-30 (zero untagged requirements; required from
      # Phase 8, so the advisory flag is gone).
      - name: Keep test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: |
            nextest-output.log
            nfr-gates-output.log
          if-no-files-found: ignore

  # The test suite, split by package group, on Linux and macOS. Each job:
  # build its test binaries as its own timestamped phase, run one bounded
  # nextest invocation at two threads (inside an outer `timeout` where the
  # platform has one), dump the process tree if that timeout (or the test
  # run) fails, and always keep the log. Linux is split because a monolithic
  # nextest step aged past forty-five minutes and lost its runner agent;
  # macOS runs the same groups so the heavy WASM and loopback packages do not
  # compete with the whole suite for a three-core runner.
  test-split:
    name: test (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [core, engines, shell, extensions]
        include:
          - group: core
            packages: '-p lca-protocol -p lca-permissions -p lca-session -p lca-config -p lca-provider -p lca-testkit -p lca-ext-abi'
          - group: engines
            packages: '-p lca-tools -p lca-core -p lca-ext-host -p lca-ext-native'
          - group: shell
            packages: '-p lca-cli -p lca-tui -p lca-registry -p lca-sdk -p lca-regressions'
          - group: extensions
            packages: '-p antigravity -p compaction-default -p conformance -p hooks-example -p openai-compatible -p skills -p ui-example'
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup set profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: clippy and docs (once per OS, warnings denied)
        # The plan keeps clippy and doc per-OS (they compile cfg-gated code);
        # running them on the `core` group of each OS gives Linux and macOS
        # the signal without repeating it in every group. Windows carries its
        # own in the `test` job.
        if: matrix.group == 'core'
        shell: bash
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Build the test binaries (its own phase)
        shell: bash
        run: |
          echo "[$(date -u +%FT%TZ)] build start"
          cargo test --no-run ${{ matrix.packages }}
          echo "[$(date -u +%FT%TZ)] build done"
      - name: Run this group's tests (bounded)
        shell: bash
        run: |
          set -o pipefail
          echo "[$(date -u +%FT%TZ)] run start (group ${{ matrix.group }}, two threads)"
          # Outer bound shorter than the job timeout where the platform has
          # `timeout`: a step that overruns dies with its own process tree
          # printed rather than as an anonymous agent that stops answering.
          # macOS has no `timeout` by default; nextest's slow-timeout and the
          # job timeout cover it there.
          if command -v timeout >/dev/null 2>&1; then
            WRAP=(timeout -k 30s 22m)
          else
            WRAP=()
          fi
          "${WRAP[@]}" cargo nextest run ${{ matrix.packages }} --no-fail-fast \
            --test-threads=2 --failure-output immediate \
            -E 'not test(/nfr|instantiation|hook|epoch/)' \
            2>&1 | tee "nextest-${{ matrix.group }}.log"
          status=${PIPESTATUS[0]}
          echo "[$(date -u +%FT%TZ)] run end (status $status)"
          if [ "$status" -ne 0 ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            echo "== process tree, oldest first (a stuck test shows its package by name) =="
            ps -eo pid,ppid,etime,stat,cmd --sort=-etime | head -80 || true
            echo "== pty / shell / sleep descendants =="
            ps -eo pid,ppid,cmd | grep -E 'pty|/bin/sh|bin/sleep|nextest' | grep -v grep | head -40 || true
          fi
          exit $status
      - name: Keep this group's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-${{ matrix.os }}-${{ matrix.group }}
          path: nextest-*.log
          if-no-files-found: ignore

  ubuntu-gates:
    name: ubuntu gates (timing, deny, traceability)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup set profile minimal
          rustup component add rustfmt
      # Formatting is platform-independent; it runs once, here, instead of
      # in all three test jobs.
      - name: rustfmt
        run: cargo fmt --check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # Verifies: NFR-4 (instantiation), NFR-5 (hook overhead against a
      # release wasmtime), NFR-29 (epoch interruption) - and NFR-30's
      # advisory predecessor lives in the deny step below (required
      # from Phase 8).
      - name: nfr release gates (serial)
        shell: bash
        run: |
          set -o pipefail
          # One at a time: these five measure microseconds, and the
          # epoch test's spinner thread alone can push the hook
          # overhead test past its millisecond (it did, right here).
          timeout -k 30s 20m cargo nextest run --release -p lca-ext-host \
            --test-threads=1 --failure-output immediate \
            -E 'test(/nfr|instantiation|hook|epoch/)' \
            2>&1 | tee nfr-gates-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            ps -eo pid,ppid,etime,stat,cmd --sort=-etime | head -60 || true
          fi
          exit $status
      # Verifies: NFR-16 (dependency license and advisory checks on merge).
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
      # Verifies: NFR-30 (zero untagged requirements; required from
      # Phase 8, so the advisory flag is gone).
      - name: requirements traceability (NFR-30)
        shell: bash
        run: bash scripts/traceability.sh
      - name: Keep gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-output-ubuntu
          path: nfr-gates-output.log
          if-no-files-found: ignore

  # Verifies: docs/testing-plan.md section 13. The fuzz crate is its own
  # workspace, so no other gate builds it - without this a parser change
  # leaves a fuzz target uncompilable and the nightly `fuzz` job dies at
  # build, after the other targets have burned their full 600s. This only
  # checks the targets build (seconds), it never fuzzes.
  fuzz-check:
    name: fuzz targets build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> fuzz/target"
      - name: Every fuzz target compiles
        shell: bash
        run: bash scripts/fuzz-check.sh

  # Verifies: docs/testing-plan.md section 13. The extension crates are
  # ordinary workspace members, so every other gate builds them *natively*
  # and says nothing about their wasm target. Their `wit_bindgen::generate!`
  # blocks are target-shaped: when a world grows an import, every `with:`
  # block has to map it, and the one that doesn't only fails at
  # `--target wasm32-wasip2` - which nothing built until the publish job's
  # component step, after the binaries were already attached. Cycle 5's
  # release hit exactly that.
  wasm-check:
    name: extension components build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and the component target
        run: |
          rustup set profile minimal
          rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Every extension component compiles
        shell: bash
        run: bash scripts/wasm-check.sh

  # NFR-7: measure binary size and cold start, fail on a threshold breach.
  size-and-startup:
    name: size and startup gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release -p lca-cli
      - name: Measure against the Phase 0 thresholds
        run: bash scripts/perf-gate.sh
