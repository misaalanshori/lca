name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Diagnostic ceiling: wedged test jobs have been sitting at the
    # nextest step for the better part of an hour on the Linux and
    # Windows pools, and a killed job stores its logs while an
    # eternally running one stores nothing - forty-five minutes is
    # triple the healthy suite time and turns a wedge into evidence.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup set profile minimal
          rustup component add rustfmt clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: docs (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
# Verifies: NFR-12 (the suite runs on Linux, macOS, and Windows).
      - name: tests (nextest)
        # -j2: the debug suite at full parallelism wedged the hosted
        # runners on the Linux and Windows pools - jobs sat mid-step
        # for the better part of an hour and GitHub's own annotation
        # blamed CPU/memory starvation of the runner agent - while the
        # macOS pool, with more cores to spare, kept finishing in
        # minutes. Same tests, same order, half the peak load; the
        # steps after this one (nfr gates, cargo-deny, traceability)
        # were what never got to run.
        run: |
          set -o pipefail
          cargo nextest run --workspace --no-fail-fast --test-threads=2 \
            2>&1 | tee nextest-output.log
      # Verifies: NFR-30 (advisory before Phase 8, required from Phase 8).
      # Verifies: NFR-5's real bound: hook overhead measured against a
      # release wasmtime (debug instrumentation dominates the1 ms).
      - name: nfr release gates
        run: |
          set -o pipefail
          cargo nextest run --release -p lca-ext-host -E 'test(/nfr|instantiation|hook|epoch/)' \
            2>&1 | tee nfr-gates-output.log
      # Verifies: NFR-16 (dependency license and advisory checks on merge).
      - name: cargo-deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
      # The suite's raw output survives a failed step as an artifact:
      # GitHub's job-log storage spent a whole day failing to ingest,
      # and a failure whose name exists nowhere is not evidence.
      - name: Keep failing test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: |
            nextest-output.log
            nfr-gates-output.log
          if-no-files-found: ignore
      # Verifies: NFR-30 (zero untagged requirements; required from
      # Phase 8, so the advisory flag is gone).
      - name: requirements traceability (NFR-30)
        shell: bash
        run: bash scripts/traceability.sh

  # NFR-7: measure binary size and cold start, fail on a threshold breach.
  size-and-startup:
    name: size and startup gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release -p lca-cli
      - name: Measure against the Phase 0 thresholds
        run: bash scripts/perf-gate.sh
