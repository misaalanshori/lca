name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Diagnostic ceiling: wedged test jobs sat at the nextest step
    # for the better part of an hour on the hosted pools, and a killed
    # job stores its logs while an eternally running one stores
    # nothing. Forty-five minutes once killed a suite that was simply
    # slow (it has completed naturally in thirty-seven) on the same
    # pool where another attempt never finished at all, so the ceiling
    # is now ninety: generous for a slow day, still finite for a
    # wedge.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup set profile minimal
          rustup component add rustfmt clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: docs (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
# Verifies: NFR-12 (the suite runs on Linux, macOS, and Windows).
      - name: tests (nextest)
        # bash, not the runner's default shell: `set -o pipefail` and
        # `tee` do not exist in PowerShell, and a shell-level error
        # would fail this step before a single test ran - which is
        # exactly what the first tee'd Windows run did.
        shell: bash
        # Full parallelism: a Linux suite stretched past forty-five
        # minutes at half threads, and every run that crossed roughly
        # that age lost the runner agent mid-step ("hosted runner lost
        # communication"), twice in a row. Finishing sooner is the
        # reliable defense; the per-test ceiling in
        # .config/nextest.toml still stops any single test from
        # hanging the step.
        run: |
          set -o pipefail
          # The timing gates - NFR-4's instantiation, NFR-5's hook
          # overhead, NFR-29's epoch tests - run in the dedicated step
          # below on a release build with the machine to itself, which
          # is where their thresholds were measured; inside the
          # parallel debug suite they read whatever else is running
          # (one Windows run measured a199 ms "instantiation" beside
          # twenty other tests). They are excluded from this step by
          # name only - never skipped, and the same predicate selects
          # them in the gates step.
          cargo nextest run --workspace --no-fail-fast \
            -E 'not test(/nfr|instantiation|hook|epoch/)' \
            2>&1 | tee nextest-output.log
      # Verifies: NFR-30 (advisory before Phase 8, required from Phase 8).
      # Verifies: NFR-5's real bound: hook overhead measured against a
      # release wasmtime (debug instrumentation dominates the1 ms).
      - name: nfr release gates
        shell: bash
        run: |
          set -o pipefail
          # One at a time: these five measure microseconds, and the
          # epoch test's spinner thread alone can push the hook
          # overhead test past its millisecond (it did, right here).
          cargo nextest run --release -p lca-ext-host --test-threads=1 \
            -E 'test(/nfr|instantiation|hook|epoch/)' \
            2>&1 | tee nfr-gates-output.log
      # Verifies: NFR-16 (dependency license and advisory checks on merge).
      - name: cargo-deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
      # The suite's raw output survives a failed step as an artifact:
      # GitHub's job-log storage spent a whole day failing to ingest,
      # and a failure whose name exists nowhere is not evidence.
      - name: Keep failing test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: |
            nextest-output.log
            nfr-gates-output.log
          if-no-files-found: ignore
      # Verifies: NFR-30 (zero untagged requirements; required from
      # Phase 8, so the advisory flag is gone).
      - name: requirements traceability (NFR-30)
        shell: bash
        run: bash scripts/traceability.sh

  # NFR-7: measure binary size and cold start, fail on a threshold breach.
  size-and-startup:
    name: size and startup gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release -p lca-cli
      - name: Measure against the Phase 0 thresholds
        run: bash scripts/perf-gate.sh
