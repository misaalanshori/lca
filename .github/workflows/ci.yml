name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup set profile minimal
          rustup component add rustfmt clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: docs (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
# Verifies: NFR-12 (the suite runs on Linux, macOS, and Windows).
      - name: tests (nextest)
        run: cargo nextest run --workspace --no-fail-fast
      # Verifies: NFR-30 (advisory before Phase 8, required from Phase 8).
      # Verifies: NFR-5's real bound: hook overhead measured against a
      # release wasmtime (debug instrumentation dominates the1 ms).
      - name: nfr release gates
        run: cargo nextest run --release -p lca-ext-host -E 'test(/nfr|instantiation|hook|epoch/)'
      # Verifies: NFR-16 (dependency license and advisory checks on merge).
      - name: cargo-deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: requirements traceability (NFR-30, advisory before Phase 8)
        shell: bash
        continue-on-error: true
        run: bash scripts/traceability.sh

  # NFR-7: measure binary size and cold start, fail on a threshold breach.
  size-and-startup:
    name: size and startup gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release -p lca-cli
      - name: Measure against the Phase 0 thresholds
        run: bash scripts/perf-gate.sh
