name: diag
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-19 clang-19
          echo "== clang-cl:"; /usr/lib/llvm-19/bin/clang-cl --version | head -2
          cargo install cargo-xwin --version0.23.1 --locked --root /tmp/xw 2>/dev/null || true
          if [ ! -x /tmp/xw/bin/cargo-xwin ]; then
            curl -sL https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
            sudo mv cargo-xwin-v0.23.1.x86_64-unknown-linux-musl/cargo-xwin /tmp/xwin 2>/dev/null || true
          fi
          XWIN=/tmp/xw/bin/cargo-xwin
          [ -x "$XWIN" ] || XWIN=/tmp/xwin
          "$XWIN" xwin --version
          "$XWIN" xwin splat --accept-msvc-licenses crt sdk --output /tmp/xwinsplat
          echo "== intrin.h sha:"; sha256sum /tmp/xwinsplat/crt/include/intrin.h
          echo "== line246:"; sed -n '244,248p' /tmp/xwinsplat/crt/include/intrin.h
          echo "== local reference:"; sha256sum $HOME/.cache/cargo-xwin/xwin/crt/include/intrin.h
