[workspace]
resolver = "2"
members = ["crates/*", "extensions/*"]
# The NFR-2/NFR-15 measurement fixture: a crate that is not part of this
# workspace (its own target dir, its own lock), the way phase0/ was.
exclude = ["scripts/nfr2-host"]
# The root package is the regression-suite target only. Without this, a bare
# `cargo build --release` builds that target and nothing else, which is what
# the publish workflow needs the `lca` binary from.
default-members = ["crates/*", "extensions/*"]

# The regression suite (docs/testing-plan.md section 7, NFR-24) lives at the
# workspace root so every released defect's guard sits in one named home
# instead of buried in whichever crate's suite first caught it. Each defect
# is one file under tests/regressions/ named after its tracking id; mod.rs
# includes them into this single test target.
[package]
name = "lca-regressions"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
compaction-default = { path = "extensions/compaction-default" }
# The gh #24 consent guard drives `lca_cli::ext::confirm_with` directly: the
# prompt lives in the binary's own crate, behind a `confirm` nothing else
# exports.
# RM-001: the pi-parity harness drives `Cli::try_parse_from` for the
# rpc-mode witness, so clap rides as a dev-dependency (workspace pin).
clap.workspace = true
lca-cli = { path = "crates/lca-cli" }
lca-config = { path = "crates/lca-config" }
lca-core = { path = "crates/lca-core" }
# The gh #12 seam guard drives a stub `ExtensionDispatch` (for the
# optional Rust-side markdown transform) through the host collection.
lca-ext-abi = { path = "crates/lca-ext-abi" }
lca-ext-host = { path = "crates/lca-ext-host" }
lca-ext-native = { path = "crates/lca-ext-native" }
lca-permissions = { path = "crates/lca-permissions" }
lca-provider = { path = "crates/lca-provider" }
lca-protocol = { path = "crates/lca-protocol" }
lca-registry = { path = "crates/lca-registry" }
# The gh #14 guard drives `Session::with_permission_prompt` end to end.
lca-sdk = { path = "crates/lca-sdk" }
lca-session = { path = "crates/lca-session" }
lca-testkit = { path = "crates/lca-testkit" }
lca-tools = { path = "crates/lca-tools" }
lca-tui = { path = "crates/lca-tui" }
lca-ui = { path = "crates/lca-ui" }
image.workspace = true
antigravity = { path = "extensions/antigravity" }
lca-subscription = { path = "crates/lca-subscription" }
lca-wire-openai = { path = "crates/lca-wire-openai" }
openai-compatible = { path = "extensions/openai-compatible" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[[test]]
name = "regressions"
path = "tests/regressions/mod.rs"

# RM-001 (#93): the pi-conformance harness. Test functions carry the
# `pi_parity_` prefix so `cargo nextest run -E 'test(pi_parity)'` selects
# exactly this target; red witnesses for future milestones are
# `#[ignore]`-gated so main stays green and are listed in
# `docs/pi-parity.md`.
[[test]]
name = "pi-parity"
path = "tests/pi-parity/mod.rs"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.1"
repository = "https://github.com/misaalanshori/lca"

# Dependency justification (SRDD dependency table is the closed list):
# serde/serde_json - serialization (no fallback; structural).
# thiserror - library error types; anyhow - binary only.
# tokio - async runtime (structural commitment, ADR-0014).
# hyper + rustls - HTTPS transport (reqwest is the documented heavier alternative).
# The pi-port engine parses raw input itself; ratatui is gone (the TUI port
# replaced it), and crossterm went with the consent prompt it last served
# (gh #24 made that prompt read a line instead of a raw keypress).
# clap - argument parsing.
# tracing - structured logging.
# sha2 - digest verification.
# ipnet - CIDR range checks for net/net-local (Phase 3).
# toml - configuration and manifest parsing.
# proptest - property tests (dev-dependency).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
# tower-service - the tiny (std-only) `Service` trait the hyper-util
# `HttpConnector` accepts as a custom DNS resolver. The `net` rebinding fix
# pins the address it already checked so hyper cannot re-resolve to a local
# address between the check and the connect; see capabilities.rs and ADR-0025.
tower-service = "0.3"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "logging", "tls12"] }

clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# image - decode/resize/JPEG-encode for the read tool's per-model image
# profiles (#39, pi's `inputLimits.images.resize`). Pure Rust, no system
# libraries; default features off, only the sniffed formats plus the JPEG
# encoder. Hand-rolling five format parsers would be more code, not less
# (SRDD dependency rule).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# shell-words - POSIX shell-word splitting for the `$EDITOR` command
# (#121). Zero dependencies; hand-rolling quote handling is exactly the
# quoting bug being fixed (SRDD dependency rule).
shell-words = "1"
# tempfile - the external editor's buffer file (#121). Already resolved
# in Cargo.lock (via proptest); promoting the edge adds no new packages.
tempfile = "3"
sha2 = "0.10"
# sha1 - pi-antigravity's stableUuid (RFC 4122 v5-style labels) needs
# SHA-1 exactly; SHA-256 truncated would fingerprint differently.
# Same RustCrypto family as sha2, pure Rust, wasm-safe.
sha1 = "0.10"
# zip - the ADR-0010 HTTPS archive format; DEFLATE gets a maintained
# implementation instead of a hand-written one (SRDD dependency rule).
zip = { version = "2", default-features = false, features = ["deflate"] }
# unicode-width / unicode-segmentation - East Asian width classes and
# grapheme-cluster iteration for the pi TUI port's text measurement and
# cursor motion (ADR-0036). Both are already in Cargo.lock transitively;
# promoted to direct dependencies rather than hand-maintaining the
# Unicode tables.
unicode-width = "0.2"
unicode-segmentation = "1.13"
# regex - the `/resume` session-search grammar's `re:` arm (ADR-0036
# addendum, R2). Already a direct dependency of `lca-tools` (the grep
# tool) at this version; promoted to the workspace table so `lca-ui` can
# name it without a second version.
regex = "1"
# unicode-normalization - NFKC for the `edit` tool's fuzzy fallback
# (#114, pi's `normalizeForFuzzyMatch`). Generated Unicode tables, not
# hand-writable; one tiny dependency (tinyvec). License Unicode-3.0 is
# already on the cargo-deny allow list.
unicode-normalization = "0.1"
# ignore - ripgrep's gitignore-respecting walker for `glob` and `grep`
# (#118, #119). Gitignore semantics (negations, parent directories,
# global excludes) are a correctness trap to hand-roll; the automata
# crates are already in the graph, walkdir/crossbeam-utils join it.
# Licenses (MIT/Unlicense) are on the cargo-deny allow list.
ignore = "0.4"
# globset - `*`-stays-in-segment glob matching for the `glob` tool
# (#119, pi's `find` contract). Replaces a hand-rolled matcher that knew
# no character classes; footprint is aho-corasick/bstr.
globset = "0.4"
ipnet = "2"
# toml_edit - comment-preserving edits to the user config file from the
# `/theme` and `/thinking` pickers (E2). Already in the dependency graph
# through `toml`; this is a direct edge, not a new crate.
toml_edit = "0.22"
toml = "0.8"
wasmtime = { version = "49.0.0", default-features = false, features = [
    "component-model",
    "async",
    "std",
    "runtime",
    "parallel-compilation",
] }
proptest = "1"

[workspace.lints.rust]
missing_docs = "warn"

# S3: production paths stay panic-free workspace-wide (clippy.toml scopes the
# allowlist away from tests). A deliberate panic site carries
# `#[allow(clippy::expect_used)]` (or the specific lint) with a one-line
# justification; the allowlist is the audit trail. These are `deny`, not
# `warn` (#107): a bare local `cargo clippy` binds them, not just CI's
# `-D warnings`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# gh #53 / #37: these crates are I/O-bound plumbing (spawns, pipes,
# HTTP round-trips, file reads, startup parsing) - optimize them for
# size, not speed, for NFR-1's budget. (gh #98: per-package opt on
# the binary crate itself balloons the binary under fat LTO - libs
# only.)
[profile.release.package.mcp]
opt-level = "z"
[profile.release.package.lca-wire-mcp]
opt-level = "z"
[profile.release.package.lca-session]
opt-level = "z"
[profile.release.package.lca-config]
opt-level = "z"
