# cargo-deny policy: license allow list and advisory checking (NFR-16,
# release policy "Supply chain"). Runs on every merge and on a schedule.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0386 (2026-10-23): `tokio::io::unix::AsyncFd`'s safe
    # constructors (`new`, `with_interest`, `try_new`, `try_with_interest`)
    # accept any `T: AsRawFd`, so safe code can register an arbitrary or
    # closed descriptor - or close/replace the descriptor while the `AsyncFd`
    # lives - and the I/O driver's `epoll`/`kqueue` user data then points at
    # freed memory when readiness fires. Patched in 1.51.6 / 1.53.3 / 1.54.0
    # by deprecating those constructors in favour of `unsafe register`.
    #
    # Dead code in this workspace. `AsyncFd` and its constructors have zero
    # call sites in `crates/` and `extensions/` (grep: no `AsyncFd` and no
    # `tokio::io::unix` anywhere, production or test). Every descriptor LCA
    # owns is driven either by `tokio::process`/`tokio::net` (which register
    # internally, past the deprecated surface) or by our own `poll` loops on
    # a blocking thread (`crates/lca-tools/src/pty.rs`), so the constructor
    # the advisory is about is never reached.
    #
    # Why not bump to the fixed tokio: 1.54 measured a *real diagnostic
    # regression* in this tree. `crates/lca-registry`'s streamed-cap loop
    # (`plain_get`) stops reading at the byte limit and returns a message naming
    # the limit; on 1.54 the HTTP/1.1 body decoder surfaces `Canceled` from
    # `body.frame()` *before* a frame is delivered, so the cap check never runs
    # and the user gets "client error (Canceled)" instead of "over the N byte
    # limit". The row that caught it is
    # `tests/regressions/355-update-fetch-is-bounded.rs`'s
    # `an_installer_body_over_the_cap_is_refused_while_reading`, which asserts
    # the refusal *names the limit*. Losing that message is a UX regression on a
    # supply-chain guard, so the pin stays until our loop can attribute a
    # canceled read - which is its own cycle, not a dependency bump.
    #
    # Remove when: `cargo deny` can express "this advisory is fixed in the
    # resolved version" for yanked-style entries, or when the ignore proves
    # unnecessary on a future tokio bump - whichever comes first.
    "RUSTSEC-2026-0386",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
