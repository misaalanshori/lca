# cargo-deny policy: license allow list and advisory checking (NFR-16,
# release policy "Supply chain"). Runs on every merge and on a schedule.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: `paste` is archived, not vulnerable - it
    # arrives only through ratatui0.29's macro layer, and swapping it
    # (for `pastey` or a fork) buys zero behavior change for a
    # transitive macro utility. Recorded here with the reason, as the
    # closed dependency list requires; every other advisory still
    # fails the build.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
