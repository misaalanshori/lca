# Clippy configuration (R17).
#
# The `unwrap_used`/`expect_used`/`panic` restriction lints (enabled per
# crate in `lca-tui` and `lca-ui`) keep production paths panic-free while
# leaving test code free to unwrap. Tests are where an unwrap is a
# deliberate assertion, so the lints are scoped away from them here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
