# Curated per-model prices (gh #125), USD per 1M tokens, verified
# 2026-10-08 against the providers' published rate cards. Only
# verified entries live here: a model without an entry shows
# tokens-only downstream - no entry, no number, never a guess.
# Keyed by bare model id (lowercased for lookup); a `profile/`
# prefix on the configured name is stripped before matching.
# Cache buckets carry their own published rates (gh #274): a cache read
# is heavily discounted by every vendor, and a cache write can carry a
# premium (the Claude line bills 1.25x input). An entry that omits
# `cache_read` / `cache_write` falls back to its `input` rate, so a
# missing rate degrades to the old flat behaviour rather than to zero.

["gpt-4o"]
input = 2.50
cache_read = 1.25
cache_write = 2.50
output = 10.00

