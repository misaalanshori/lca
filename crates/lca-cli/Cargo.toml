[package]
name = "lca-cli"
description = "The lca binary: argument parsing, headless mode, and wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = [
    "bundled-openai-compat",
    "bundled-compaction-default",
    "bundled-skills",
]
# ADR-0013: the default provider, compaction strategy, and skills
# handling ship enabled; users can disable any of them (FR-SESS-5's
# default compaction, SRDD's bundled-skills/bundled-compaction-default).
bundled-openai-compat = ["dep:openai-compatible"]
bundled-compaction-default = ["dep:compaction-default"]
bundled-skills = ["dep:skills"]

[dependencies]
compaction-default = { path = "../../extensions/compaction-default", optional = true }
skills = { path = "../../extensions/skills", optional = true }
lca-protocol = { path = "../lca-protocol" }
lca-config = { path = "../lca-config" }
lca-session = { path = "../lca-session" }
lca-registry = { path = "../lca-registry" }
lca-ext-host = { path = "../lca-ext-host" }
toml.workspace = true
lca-permissions = { path = "../lca-permissions" }
lca-provider = { path = "../lca-provider" }
lca-tools = { path = "../lca-tools" }
lca-core = { path = "../lca-core" }
lca-ext-native = { path = "../lca-ext-native" }
lca-tui = { path = "../lca-tui" }
# Direct edge to crossterm for the install consent prompt (already in the
# graph through lca-tui; no new crate).
crossterm.workspace = true
openai-compatible = { path = "../../extensions/openai-compatible", optional = true }
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
lca-testkit = { path = "../lca-testkit" }
# sha2 - digest display in the install e2e (the registry's own dep; test-side use).
sha2.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio.workspace = true

[[bin]]
name = "lca"
path = "src/main.rs"

[lints]
workspace = true
