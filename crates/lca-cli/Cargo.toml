[package]
name = "lca-cli"
description = "The lca binary: argument parsing, headless mode, and wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = [
    "bundled-openai-compat",
    "bundled-compaction-default",
]
# ADR-0013: the default provider and compaction strategy ship enabled;
# users can disable either of them (FR-SESS-5's default compaction).
# There is deliberately no `bundled-skills` feature (#92): ADR-0034 moved
# the skills merge host-side, so the flag compiled an extension nothing
# registered. `extensions/skills` stays in the tree as the
# `context-transform` worked example and still builds for `wasm32-wasip2`
# under `scripts/wasm-check.sh`.
bundled-openai-compat = ["dep:openai-compatible"]
bundled-compaction-default = ["dep:compaction-default"]

[dependencies]
compaction-default = { path = "../../extensions/compaction-default", optional = true }
lca-protocol = { path = "../lca-protocol" }
lca-config = { path = "../lca-config" }
lca-session = { path = "../lca-session" }
lca-registry = { path = "../lca-registry" }
lca-ext-host = { path = "../lca-ext-host" }
toml.workspace = true
# E2: comment-preserving edits to the user config file (theme, thinking).
toml_edit.workspace = true
# #121: the external editor's buffer file (already in Cargo.lock) and
# POSIX splitting for its command line (zero-dependency).
shell-words.workspace = true
tempfile.workspace = true
lca-permissions = { path = "../lca-permissions" }
lca-provider = { path = "../lca-provider" }
lca-tools = { path = "../lca-tools" }
lca-core = { path = "../lca-core" }
# gh #12: the host collects native extensions' optional Rust-side markdown
# transforms (no WIT surface); the crate without features is the light
# contract half (protocol only), not the Wasmtime host bindings.
lca-ext-abi = { path = "../lca-ext-abi" }
lca-ext-native = { path = "../lca-ext-native" }
lca-ui = { path = "../lca-ui" }
openai-compatible = { path = "../../extensions/openai-compatible", optional = true }
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# gh #19: `signal(SIGPIPE, SIG_DFL)` - std installs Rust's ignore handler
# and exposes no way to undo it, and hand-rolling the syscall would be more
# unsafe code, not less. The same crate `lca-tools` (pty) and `lca-tui`
# (console modes) already reach for. Unix only: Windows has no SIGPIPE to
# restore, so the call site compiles away there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lca-testkit = { path = "../lca-testkit" }
# sha2 - digest display in the install e2e (the registry's own dep; test-side use).
sha2.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio.workspace = true

[[bin]]
name = "lca"
path = "src/main.rs"

[lints]
workspace = true
