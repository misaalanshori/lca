[package]
name = "lca-ext-abi"
description = "The contract crate: the lca:ext WIT package and generated bindings. Published separately so extension authors can depend on it without the agent."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
lca-protocol = { path = "../lca-protocol" }
# `sync` only: the nested-call channel types (gh #77). The contract
# stays runtime-free; hosts bridge onto their own runtimes.
tokio = { version = "1", features = ["sync"] }
wasmtime = { workspace = true, optional = true, features = ["cranelift"] }

[features]
default = []
# Host-side bindings for the binary; extension authors don't need this.
host = ["dep:wasmtime"]

[lints]
workspace = true
