[package]
name = "lca-session"
description = "Session storage: the append-only log, forking, resume, export, durable compaction records."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
lca-protocol = { path = "../lca-protocol" }
# The session log records the extension ABI version in its `session-start`
# record; source it from the one contract crate so it cannot drift from the
# frozen `lca:ext` version (no `host` feature, so no wasmtime).
lca-ext-abi = { path = "../lca-ext-abi" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
