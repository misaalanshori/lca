[package]
name = "lca-tui"
description = "Terminal engine and widget library: the pi TUI port (ADR-0036)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# ADR-0036: the port's own dependencies (unicode tables + OS backend).
unicode-width.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
# R18: the pi width golden vectors are JSON; parse them with the workspace's
# serde_json (already a dependency of lca-tools/lca-protocol).
serde_json.workspace = true
