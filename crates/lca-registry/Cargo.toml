[package]
name = "lca-registry"
description = "OCI and plain-HTTPS-archive extension resolution, the install tree, and the extension lockfile (ADR-0010, FR-DIST-*)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
debug-trace = ["lca-debug/debug-trace"]

[dependencies]
lca-debug = { path = "../lca-debug" }
# Dependency justifications (the SRDD's closed list and its rule):
# sha2 - digest verification (listed).
# hyper/hyper-util/hyper-rustls - the existing HTTP client; the OCI
#   resolver uses the table's documented fallback, "direct OCI
#   Distribution API calls over the existing HTTP client", rather than
#   pulling wasm-pkg-client, because anonymous pulls are three GETs and
#   a header check.
# zip - reads (and, for tests and authors, packs) the ADR-0010 archive;
#   DEFLATE must not be hand-written - SRDD "Dependencies need a reason".
#   9.x is the line that closed the `extract()`/AES/name-mismatch advisories
#   (gh #607), and `deflate-flate2` is the leanest feature set that still
#   writes DEFLATE. `read_archive` turns on `validate_header_consistency`:
#   zip leaves it off by default, and we read packages we did not author.
# flate2 - inflates the embedded model catalog at first lookup (gh #260).
#   This direct edge is also what gives `zip`'s `deflate-flate2` a backend:
#   it pins `rust_backend` (miniz_oxide + crc32fast, no C toolchain, no
#   zlib-rs), and one decompressor serves both the catalog's gzip and the
#   archive's DEFLATE. miniz_oxide alone cannot read a gzip wrapper, and
#   hand-parsing that header is not worth writing. Drop this line and flate2
#   fails to compile ("no backend enabled") rather than degrading silently.
# lca-ext-abi - the ABI-window rule the catalog filter shares with the
#   manifest check (single source, no duplicated version logic).
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
# tower-service - the tiny `Service` trait `HttpConnector` implements. The
# proxy layer (gh #308) wraps that connector, so it names the trait directly.
# Already in the workspace graph via the `net` capability client (gh #145);
# this adds an edge, not a package.
tower-service.workspace = true
tokio.workspace = true
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lca-ext-abi = { path = "../lca-ext-abi" }

[dev-dependencies]
lca-testkit = { path = "../lca-testkit" }
tracing.workspace = true

[lints]
workspace = true
