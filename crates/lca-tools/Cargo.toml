[package]
name = "lca-tools"
description = "Built-in tools behind a swappable backend trait (ADR-0013)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
lca-protocol = { path = "../lca-protocol" }
lca-permissions = { path = "../lca-permissions" }
image.workspace = true
# The ABI line for the host User-Agent (V2, ADR-0031); tiny, no wasmtime.
lca-ext-abi = { path = "../lca-ext-abi" }
tokio.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Dependency justification (SRDD closed list): hyper with rustls IS the
# documented HTTPS transport; the `net` capability performs requests
# host-side exactly like the OpenAI-compatible provider does.
hyper.workspace = true
hyper-util.workspace = true
tower-service.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
# Dependency justification (SRDD closed list + review): `regex` powers the
# built-in grep tool. Writing a correct regex engine is a multi-year project
# (the same argument ADR-0001 makes for not writing a runtime), and grep
# without regex is a materially worse tool for a coding agent. Footprint:
# regex-automata, aho-corasick, memchr, memchr2 — no transitive C code.
regex = "1"
# Dependency justification (SRDD closed-list row: sha2 - digest
# verification): attachment content addresses are SHA-256, matching the
# proposal hash (`lca-permissions`) and keeping one hash vocabulary.
sha2.workspace = true
# Dependency justification (SRDD dependency rule + review): `ignore` is
# ripgrep's parallel gitignore-respecting walker, which the `glob` and
# `grep` tools enumerate through (#118, #119). Hand-rolling gitignore
# semantics (negations, parent dirs, global excludes) is a correctness
# trap; footprint is the same automata crates already in the graph
# (regex-automata, memchr) plus walkdir/crossbeam-utils.
ignore.workspace = true
# Dependency justification (SRDD dependency rule + review): `globset`
# matches the `glob` tool's patterns with `*`-stays-in-segment
# semantics (#119, pi's `find` contract). The hand-rolled matcher it
# replaces knew no character classes; footprint is aho-corasick/bstr.
globset.workspace = true
# Dependency justification (SRDD dependency rule + review): `unicode-
# normalization` supplies NFKC for the `edit` tool's fuzzy fallback
# (#114, pi's `normalizeForFuzzyMatch`). The normalization tables are
# generated Unicode data, not hand-writable; footprint is one tiny crate
# (tinyvec), no C code.
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
# Dependency justification (SRDD closed list + review): `libc` exposes the
# POSIX pty and ioctl APIs (posix_openpt, ioctl TIOCGPTN/TIOCSPTLCK/
# TIOCSWINSZ) that pseudo-terminal allocation needs; std has no pty API and
# hand-rolling raw syscalls would be more unsafe code, not less. Zero
# transitive dependencies.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Dependency justification: Job Objects for process-tree termination on
# Windows (docs/platform-notes.md requires them; taskkill /T alone leaves
# orphans when handles are inherited). Already in the lock file at this
# version as a Wasmtime transitive dependency, so the transitive footprint
# of the workspace does not change.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Pipes",
] }

[dev-dependencies]
lca-testkit = { path = "../lca-testkit" }
# Round-trip properties for the shell transport (ADR-0041): the invariants
# that must hold for arbitrary command text, not only the corpus rows.
proptest.workspace = true

[lints]
workspace = true
